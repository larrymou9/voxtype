name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-scan:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install VoxType with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Static security scan (bandit)
        run: bandit -r src/transcript_app

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit
